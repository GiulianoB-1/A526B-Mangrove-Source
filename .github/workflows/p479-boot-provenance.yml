name: P479 exact HLT boot provenance pin discovery (NO FLASH)

on:
  push:
    branches: [feature/p480-a3c-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download only exact P479 verified release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p p479-provenance
          gh release download p479-equivalence-reference \
            --repo GiulianoB-1/A526B-Mangrove-Kernel \
            --pattern p479-reference-14131467025.zip \
            --dir p479-provenance
          printf '%s  %s\n' \
            44412b170b639ebbbf6615e4a302ec8e4a83e09a934e32da49bbc1c801755230 \
            p479-provenance/p479-reference-14131467025.zip | sha256sum -c -
          python3 - <<'PY'
          import gzip,hashlib,json,zipfile
          from pathlib import Path
          from ci.p480_boot_repack import parse_boot
          folder=Path('p479-provenance')
          with zipfile.ZipFile(folder/'p479-reference-14131467025.zip') as z:
              print('Artifact members:',z.namelist())
              paths=[n for n in z.namelist() if Path(n).name=='MANGROVE-P479-H4-ONLY-HLT.boot.img']
              assert len(paths)==1, 'Original P479 HLT boot missing or duplicated'
              boot=z.read(paths[0])
          p=parse_boot(boot)
          assert len(boot)==100663296 and p['dtb'] and p['ramdisk']
          assert 'nohlt' not in p['cmdline'].split()
          assert 'a52.touch=1' in p['cmdline'].split()
          def h(b):return hashlib.sha256(b).hexdigest()
          rep={
              'source_repository':'GiulianoB-1/A526B-Mangrove-Kernel',
              'source_release':'p479-equivalence-reference',
              'source_run_id':43638159300,
              'source_artifact_id':14131467025,
              'archive_asset':'p479-reference-14131467025.zip',
              'archive_sha256':'44412b170b639ebbbf6615e4a302ec8e4a83e09a934e32da49bbc1c801755230',
              'boot_member':paths[0],
              'boot_sha256':h(boot),
              'boot_bytes':len(boot),
              'boot_dtb_sha256':h(p['dtb']),
              'boot_dtb_bytes':len(p['dtb']),
              'ramdisk_sha256':h(p['ramdisk']),
              'kernel_gzip_sha256':h(p['kernel']),
              'kernel_uncompressed_sha256':h(gzip.decompress(p['kernel'])),
              'cmdline':p['cmdline'],
              'header_version':p['header_version'],
              'page_size':p['page_size'],
              'nohlt_absent':True,
              'flash_authorized':False,
          }
          (folder/'P479-BOOT-PROVENANCE.json').write_text(json.dumps(rep,sort_keys=True,indent=2)+'\n')
          print('P479 pinned boot metadata:',json.dumps(rep,sort_keys=True,indent=2))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('P479 SHA-pinned reference archive verified; HLT boot extracted. NO FLASH.\n\n')
              out.write('boot SHA256: '+rep['boot_sha256']+'\n\n')
              out.write('DTB SHA256: '+rep['boot_dtb_sha256']+'\n\n')
              out.write('kernel SHA256: '+rep['kernel_uncompressed_sha256']+'\n\n')
              out.write('cmdline: `'+p['cmdline']+'`\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: P479-EXACT-BOOT-PROVENANCE-NO-IMAGE
          path: p479-provenance/P479-BOOT-PROVENANCE.json
          if-no-files-found: error
          retention-days: 90
