name: P480 A3c and NO-A3c twin images for Claude review (NO FLASH)

on:
  push:
    branches: [feature/p480-a3c-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-review:
    runs-on: ubuntu-22.04
    timeout-minutes: 210
    steps:
      - name: Checkout exactly the triggering direct-source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify baseline ancestry, H4, feature and existing source audits
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$(git rev-list -n1 p479-baseline)" HEAD
          grep -Fxq 'CONFIG_P479_H4=y' ci/build.config
          grep -Fxq 'CONFIG_P480_A3C=y' ci/build.config
          grep -Fxq 'CONFIG_SECURITY_SELINUX=y' ci/build.config
          test ! -e KernelSU/.git
          python3 ci/p480_a3c_source_audit.py --root .
      - name: Build same source twice, changing only CONFIG_P480_A3C
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
          for variant in A3C NO-A3C; do
            mkdir -p "out_$variant" "package/$variant"
            cp ci/build.config "out_$variant/.config"
            if [ "$variant" = NO-A3C ]; then
              sed -i 's/^CONFIG_P480_A3C=y$/# CONFIG_P480_A3C is not set/' "out_$variant/.config"
            fi
            cp "out_$variant/.config" "package/$variant/expected.config"
            make O="$PWD/out_$variant" ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
              LLVM=1 LLVM_IAS=1 olddefconfig
            if ! cmp -s "out_$variant/.config" "package/$variant/expected.config"; then
              diff -u "package/$variant/expected.config" "out_$variant/.config" | head -n 130 || true
              echo "::error::$variant Kconfig drift beyond one requested switch"
              exit 1
            fi
            make O="$PWD/out_$variant" ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
              LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image vmlinux
            test -s "out_$variant/arch/arm64/boot/Image"
            test -s "out_$variant/System.map"
            grep -aFq 'P479 H4 CABLE type=' "out_$variant/arch/arm64/boot/Image"
            grep -Eq '[[:space:]]p479_h4_tick([.][^[:space:]]+)?$' "out_$variant/System.map"
            if [ "$variant" = A3C ]; then
              grep -aFq 'P480 A3c CARD register rc=' "out_$variant/arch/arm64/boot/Image"
              grep -aFq 'P480 A3c LINK_SKIPPED name=' "out_$variant/arch/arm64/boot/Image"
            else
              ! grep -aFq 'P480 A3c CARD register rc=' "out_$variant/arch/arm64/boot/Image"
            fi
            cp "out_$variant/.config" "package/$variant/.config"
            sha256sum "out_$variant/arch/arm64/boot/Image" "out_$variant/System.map" \
              > "package/$variant/kernel-SHA256SUMS"
          done
          python3 - <<'PY'
          from pathlib import Path
          a=Path('package/A3C/.config').read_text()
          b=Path('package/NO-A3C/.config').read_text()
          assert a.count('CONFIG_P480_A3C=y\n')==1
          assert b==a.replace('CONFIG_P480_A3C=y\n','# CONFIG_P480_A3C is not set\n')
          print('P480 config equality: only CONFIG_P480_A3C is different')
          PY
      - name: Verify 27 live r02 pairs against pinned Samsung overlay source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p package/audit
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            'https://raw.githubusercontent.com/micr0softstore/samsung_android_kernel_a52xq/6bf351bdf18bdb228db79e66f14a7a9c0178e5d7/arch/arm64/boot/dts/samsung/a52/a52xq/a52xq_eur_open_w00_r02.dts' \
            -o package/audit/TG-r02.dts
          test "$(git hash-object --no-filters package/audit/TG-r02.dts)" = \
            72de76f7bae4b29ccc8663013936c0667a954180
          python3 ci/p480_tg_r02_overlay_source_audit.py \
            --reference-dts package/audit/TG-r02.dts \
            --report package/audit/TG-r02-overlay.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          live=json.loads(Path('ci/P480-live-r02-merged-sound-evidence.json').read_text())
          tg=json.loads(Path('package/audit/TG-r02-overlay.json').read_text())
          assert live['compatible']=='qcom,kona-asoc-snd'
          assert live['model']==tg['card_model_from_fragment_2']=='lito-lagoonmtp-snd-card'
          assert live['routing_pairs']==tg['final_audio_routing_pairs']
          assert len(live['routing_pairs'])==27
          assert live['asoc_platform_names']==tg['final_platform_names']
          assert live['wsa_max_devs']==0 and live['ext_disp_audio_rx']==1
          assert 'msm-ext-disp-audio-codec-rx' in live['asoc_codec_names']
          assert live['flash_authorized'] is False
          print('Live r02 sound routes match pinned overlay: 27/27. No DTB edits.')
          PY
          cp ci/P480-live-r02-merged-sound-evidence.json package/audit/
      - name: Recover only SHA-pinned WX boot inputs and audit original DTB separately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p package/archive package/unpacked
          gh release download phase446wx-source-backup \
            --repo GiulianoB-1/A526B-Mangrove-Kernel \
            --pattern phase446wx-artifact-12271681215.zip \
            --pattern phase446wx-boot-template-12272271056.zip \
            --dir package/archive
          printf '%s  %s\n' \
            4a67e19ed23935ea6596a76cfc5f28d434cd37b7061ab7bc520a7a0ce8137a6b \
            package/archive/phase446wx-artifact-12271681215.zip | sha256sum -c -
          printf '%s  %s\n' \
            9586df44718ae3a84178ea43e4632db3c988c1652564c4586ed217e84c918efe \
            package/archive/phase446wx-boot-template-12272271056.zip | sha256sum -c -
          unzip -p package/archive/phase446wx-artifact-12271681215.zip \
            boot-final.dtb > package/unpacked/boot-final.dtb
          unzip -p package/archive/phase446wx-boot-template-12272271056.zip \
            boot-f0bisect-gki-p6-v1.img > package/unpacked/WX-boot.img
          printf '%s  %s\n' \
            ef0f35ad261a072f301c6f52521c4ff33c59595dd09f4c42df55e7642bbc7b09 \
            package/unpacked/WX-boot.img | sha256sum -c -
          if python3 ci/p480_boot_dtb_audit.py \
            --dtb package/unpacked/boot-final.dtb \
            --manifest ci/P480-a3c-native-source.json \
            --report package/audit/embedded-base-DTB.json; then
            echo 'Original base FDT has audio binding prerequisites.'
          else
            # Overlay arrives through the bootloader. Allow only the EXACT
            # known mismatch in the original base DTB for review-only images.
            python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('package/audit/embedded-base-DTB.json').read_text())
          assert j['status']=='DT_SOUND_BINDING_PREREQUISITES_FAILED'
          assert j['fdt_tree_count']==1 and j['selected_dai_link_count']==29
          assert len(j['card_candidates'])==1
          row=j['card_candidates'][0]
          assert row['checks']=={
              'compatible_real_kona':True,
              'enabled_sound_card_node':True,
              'exact_A526B_card_model':False,
              'audio_routing_nonempty_even_pairs':False,
              'platform_name_phandle_lists_aligned':True,
              'selected_29_FE_BE_platforms_all_resolve':True,
          }
          assert row['audio_routing_string_count']==0
          assert j['flash_authorized'] is False
          print('Only known pre-DTBO sound-property mismatch accepted for offline review.')
          PY
          fi
          python3 - <<'PY'
          from pathlib import Path
          from ci.p480_boot_repack import parse_boot
          original=parse_boot(Path('package/unpacked/WX-boot.img').read_bytes())['dtb']
          assert original and original==Path('package/unpacked/boot-final.dtb').read_bytes()
          print('SHA-pinned template DTB matches boot-final.dtb exactly')
          PY
      - name: Build two HLT boot-v2 reviewer images, never edit DTB
        shell: bash
        run: |
          set -Eeuo pipefail
          dtb_sha="$(sha256sum package/unpacked/boot-final.dtb | cut -d' ' -f1)"
          for variant in A3C NO-A3C; do
            image="out_$variant/arch/arm64/boot/Image"
            native_sha="$(sha256sum "$image" | cut -d' ' -f1)"
            gzip -n -c "$image" > "package/unpacked/Image-$variant.gz"
            python3 ci/p480_boot_repack.py \
              --source package/unpacked/WX-boot.img \
              --kernel "package/unpacked/Image-$variant.gz" \
              --output "package/unpacked/normal-$variant.img" \
              --report "package/$variant/repack.json" \
              --expected-template-sha256 ef0f35ad261a072f301c6f52521c4ff33c59595dd09f4c42df55e7642bbc7b09 \
              --expected-dtb-sha256 "$dtb_sha" \
              --expected-native-image-sha256 "$native_sha"
            python3 ci/p480_hlt_peer.py \
              --normal "package/unpacked/normal-$variant.img" \
              --hlt "package/$variant/P480-$variant-HLT-DO-NOT-FLASH.img" \
              --image "$image" \
              --report "package/$variant/HLT-contract.json" \
              --expected-dtb-sha256 "$dtb_sha" --commit "$GITHUB_SHA"
          done
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('package')
          records={}
          for variant in ('A3C','NO-A3C'):
              p=root/variant
              n=json.loads((p/'repack.json').read_text())
              h=json.loads((p/'HLT-contract.json').read_text())
              assert n['flash_authorized'] is False and h['flash_authorized'] is False
              assert n['hardware_validated'] is False and h['hardware_validated'] is False
              assert n['invariants']['dtb_preserved'] and n['invariants']['ramdisk_preserved']
              assert all(h['invariants'].values())
              boot=p/f'P480-{variant}-HLT-DO-NOT-FLASH.img'
              assert boot.stat().st_size==100663296
              records[variant]={'repack':n,'hlt':h,'sha256':hashlib.sha256(boot.read_bytes()).hexdigest()}
          assert records['A3C']['repack']['dtb_sha256']==records['NO-A3C']['repack']['dtb_sha256']
          assert records['A3C']['repack']['ramdisk_sha256']==records['NO-A3C']['repack']['ramdisk_sha256']
          assert records['A3C']['repack']['source_sha256']==records['NO-A3C']['repack']['source_sha256']
          assert records['A3C']['sha256']!=records['NO-A3C']['sha256']
          report={
             'result':'PASS','source_commit':records['A3C']['hlt']['source_commit'],
             'only_config_difference':'CONFIG_P480_A3C',
             'boot_dtb_unchanged':True,'ramdisk_unchanged':True,
             'a3c_image_sha256':records['A3C']['sha256'],
             'no_a3c_image_sha256':records['NO-A3C']['sha256'],
             'flash_authorized':False,'hardware_audio_verified':False,
          }
          (root/'audit'/'P480-dual-review-comparison.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2))
          PY
          for variant in A3C NO-A3C; do
            printf '%s\n' 'P480 direct-source reviewer boot; HLT; original DTB and ramdisk unchanged; NO FLASH until Claude review.' \
              > "package/$variant/README-DO-NOT-FLASH.txt"
            (cd "package/$variant" && sha256sum \
              "P480-$variant-HLT-DO-NOT-FLASH.img" repack.json HLT-contract.json .config \
              > SHA256SUMS && sha256sum -c SHA256SUMS)
            echo "P480-$variant reviewer image generated. NO FLASH." >> "$GITHUB_STEP_SUMMARY"
          done
          rm -rf package/archive package/unpacked
          cat package/audit/P480-dual-review-comparison.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload P480 A3c review image
        uses: actions/upload-artifact@v4
        with:
          name: P480-A3C-REVIEW-ONLY
          path: package/A3C/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Upload P480 NO-A3c review image
        uses: actions/upload-artifact@v4
        with:
          name: P480-NO-A3C-REVIEW-ONLY
          path: package/NO-A3C/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Upload independent routing and comparison audit
        uses: actions/upload-artifact@v4
        with:
          name: P480-DUAL-REVIEW-AUDIT
          path: package/audit/
          if-no-files-found: error
          retention-days: 90
