          python3 ci/p482_vote_symbol_audit.py out_A3C package/A3C/P482-vote-symbols.txt
          for marker in 'P482 HW_VOTE op=' 'P482 AFE_HW_VOTE block=' 'P482 AFE_HW_UNVOTE block=' 'P482 MBHC_IRQ_BLOCKED'; do
            grep -aFq "$marker" out_A3C/arch/arm64/boot/Image
          done
          python3 ci/p483_voice_audit.py out_A3C package/A3C
          for marker in 'P483 VOICE_INIT rc=' 'P483 CVD_VERSION value=' 'P483 VOICE_AUX node=' 'P483 VOICE_KCONTROLS count=' 'P483 CARD_AUTO adsp_ready=1' 'P483 CARD_POLICY auto=' 'P483 BOLERO_MACRO_INACTIVE_ALLOWED' 'P483 BOLERO_UNCLOCKED reason='; do
            grep -aFq "$marker" out_A3C/arch/arm64/boot/Image
