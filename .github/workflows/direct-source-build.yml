          grep -Eq '[[:space:]]U[[:space:]]+bolero_register_wake_irq$' package/A3C/P480-kona-symbols.txt
          grep -Eq '[[:space:]]U[[:space:]]+bolero_info_create_codec_entry$' package/A3C/P480-kona-symbols.txt
          cp out_A3C/.config out_A3C/System.map package/A3C/
          cp p480-init-order-audit.json package/A3C/
          python3 - <<'PY'
          from pathlib import Path
          data=Path('out_A3C/vmlinux').read_bytes()
          want=b'5.10.252-Mangrove SMP preempt mod_unload modversions aarch64'
          bad=b'5.10.252-Mangrove+ SMP preempt mod_unload modversions aarch64'
          assert want in data and bad not in data, 'A3c vermagic must match original P479'
