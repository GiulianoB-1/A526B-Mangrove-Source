name: Mangrove direct-source Linux 5.10 build (NO FLASH)
on:
  push:
    branches: [main, 'feature/**', 'p480/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout exactly the triggering source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # resolve the immutable p479-baseline tag
          persist-credentials: false
      - name: Toolchain and exact build config from this pinned source commit
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
          # P479 baseline starts with ci/build.config copied from verified P479.config.
          # P480 and later source commits MUST update ci/build.config and
          # ci/build-manifest.json together, in the same source commit.
          # Only the *exact* immutable baseline commit is allowed to reseal
          # generated IKHEADERS with the recorded P479 archive. Future P480
          # commits always use the normal native kernel header generator.
          test ! -e KernelSU/.git
          test -s ci/P479-original-KernelSU.Kbuild
          BASELINE="$(git rev-list -n 1 p479-baseline)"
          if [ "$BASELINE" = "$GITHUB_SHA" ]; then
            # The initial single-commit baseline uses the authentic P479
            # ReSukiSU version, not nested KernelSU Git metadata.
            python3 ci/p479_kernelsu_direct.py --root . --mode verify
            grep -Fq 'KSU_COMMIT_SHA := 239e1e88-dirty' KernelSU/kernel/Kbuild
            printf '%s  %s\n' 4613510d96312a7127828fa321fea544c23ac749d1f4ae82d9ac6b5b08167976 ci/P479-kheaders.tar.xz | sha256sum -c -
            echo MANGROVE_P479_PIN_IKHEADERS=1 >> "$GITHUB_ENV"
            # Reproduce P479's original compiled UTS fields, not the current
            # GitHub runner's hostname or today's clock.
            printf '%s  %s\n' c13afa67c23f9484f4f67348098a7ab718d938faf6fc9d5975f512979609f846 ci/P479-compile.h | sha256sum -c -
            echo KBUILD_BUILD_VERSION=3 >> "$GITHUB_ENV"
            echo KBUILD_BUILD_USER=runner >> "$GITHUB_ENV"
            echo KBUILD_BUILD_HOST=runnervmy75tu >> "$GITHUB_ENV"
            echo 'KBUILD_BUILD_TIMESTAMP=Sat Nov 14 20:43:30 UTC 2026' >> "$GITHUB_ENV"
            echo TZ=UTC >> "$GITHUB_ENV"
          else
            echo MANGROVE_P479_PIN_IKHEADERS=0 >> "$GITHUB_ENV"
          fi
          test -s ci/build.config
          test -s ci/build-manifest.json
          mkdir -p out include/generated
          cp ci/build.config out/.config
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('ci/build-manifest.json').read_text())
          assert manifest['strict'] is True and not manifest['missing_required']
          # The complete source was committed directly. Never rewrite a
          # tracked kernel header during CI; keep the exact committed source.
          import re
          header=Path('include/generated/a52_446s_manifest.h')
          assert header.is_file()
          assert re.fullmatch(r'\s*#define A52_446S_FINGERPRINT "[0-9a-f]{64}"\s*',
                              header.read_text()), 'source manifest header invalid'
          assert len(manifest['source_fingerprint_sha256']) == 64
          PY
          make O="$PWD/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 olddefconfig
          # Preserve the byte-for-byte config gate. On failure, expose drift
          # so we can correct the toolchain instead of weakening verification.
          if ! cmp -s ci/build.config out/.config; then
            echo '::error::Native olddefconfig changed the pinned source configuration'
            diff -u ci/build.config out/.config | head -n 140 || true
            exit 1
          fi
      - name: Fail-fast compile of the legacy PIL SSR ABI (no source patching)
        run: |
          set -Eeuo pipefail
          # PIL and SSR must use exactly the same legacy descriptor ABI.
          grep -Fq '#include "../../a52-compat/include/soc/qcom/subsystem_restart.h"' drivers/a52_pil/subsys-pil-tz.c
          grep -Fq '#include "../../a52-compat/include/soc/qcom/subsystem_restart.h"' drivers/a52_pil/subsystem_restart.c
          make O="$PWD/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            drivers/a52_pil/subsys-pil-tz.o
      - name: Fail-fast native A3c compile when P480 is enabled
        run: |
          set -Eeuo pipefail
          if grep -Fxq 'CONFIG_P480_A3C=y' ci/build.config; then
            test -s drivers/soc/qcom/p472_tg_audio/a3c/kona.c
            # Compile real ASM/ADM/AFE services first: donor API differences
            # must fail at compile time, not surface as a late vmlinux error.
            for source in q6asm q6adm q6afe; do
              echo "P480 real DSP service compile probe: $source"
              make O="$PWD/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
                CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
                "drivers/soc/qcom/p472_tg_audio/dsp/$source.o"
            done
            for source in kona msm-pcm-q6-v2 msm-compress-q6-v2 msm-dai-q6-v2; do
              echo "P480 native A3c compile probe: $source"
              make O="$PWD/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
                CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
                "drivers/soc/qcom/p472_tg_audio/a3c/$source.o"
            done
          else
            test ! -e drivers/soc/qcom/p472_tg_audio/a3c || \
              echo 'A3c source present but disabled in pinned P479-compatible config'
          fi
      - name: Build checked-out source, no source patching
        env:
          LOCALVERSION: ''
        run: |
          set -Eeuo pipefail
          make O="$PWD/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image vmlinux
          test -s out/arch/arm64/boot/Image
          test -s out/System.map
          if [ "$MANGROVE_P479_PIN_IKHEADERS" = 1 ]; then
            # gen_kheaders.sh strips block comments from archived compile.h.
            # Compare fields exactly using its normalization, not raw bytes.
            python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          archived=Path('ci/P479-compile.h').read_bytes()
          live=Path('out/include/generated/compile.h').read_bytes()
          assert b"/* This file is auto generated, version 3 */" in live
          assert b"/* SMP PREEMPT */" in live
          normalized=re.sub(rb"/\*((?!SPDX).)*?\*/",b"",live,flags=re.S)
          assert normalized==archived and hashlib.sha256(normalized).hexdigest()=="c13afa67c23f9484f4f67348098a7ab718d938faf6fc9d5975f512979609f846"
          print('Original P479 compile metadata reproduced (same normalized header)')
          PY
            printf '%s  %s\n' 26ae9bda166d764bf695d6c51b8799632bc6f1ea276747a9f8fd1d0caf6d3a3e out/System.map | sha256sum -c -
          fi
          grep -Fxq 'CONFIG_P479_H4=y' out/.config
          grep -Fxq 'CONFIG_SECURITY_SELINUX=y' out/.config
          if [ "$MANGROVE_P479_PIN_IKHEADERS" = 1 ]; then
            grep -aFq 'v4.2.0-rc3-239e1e88-dirty@ReSukiSU' out/arch/arm64/boot/Image
          fi
          grep -aFq 'P479 H4 CABLE type=' out/arch/arm64/boot/Image
          grep -Eq '[[:space:]]p479_h4_tick([.][^[:space:]]+)?$' out/System.map
          echo 'Direct-source build PASS. Artifact is diagnostic only; NO FLASH.' >> "$GITHUB_STEP_SUMMARY"
          sha256sum out/.config out/arch/arm64/boot/Image out/System.map >> "$GITHUB_STEP_SUMMARY"

      - name: P480 HLT boot-v2 archive-pinned packaging audit (DIAGNOSTIC ONLY, NO FLASH)
        id: package
        if: github.ref == 'refs/heads/feature/p480-a3c-native'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          grep -Fxq 'CONFIG_P480_A3C=y' out/.config
          grep -Fxq 'CONFIG_P479_H4=y' out/.config
          grep -Fxq 'CONFIG_SECURITY_SELINUX=y' out/.config
          test -s out/arch/arm64/boot/Image
          test -s out/vmlinux
          test -s out/System.map
          command -v gh
          command -v unzip
          mkdir -p p480-package/archives p480-package/unpack p480-package/output
          # Permanent original Phase446WX assets, with historical SHA256 pins.
          # These are INPUTS only, never prior run artifacts or patch chains.
          gh release download phase446wx-source-backup \
            --repo GiulianoB-1/A526B-Mangrove-Kernel \
            --pattern phase446wx-artifact-12271681215.zip \
            --pattern phase446wx-boot-template-12272271056.zip \
            --dir p480-package/archives
          printf '%s  %s\n' \
            4a67e19ed23935ea6596a76cfc5f28d434cd37b7061ab7bc520a7a0ce8137a6b \
            p480-package/archives/phase446wx-artifact-12271681215.zip | sha256sum -c -
          printf '%s  %s\n' \
            9586df44718ae3a84178ea43e4632db3c988c1652564c4586ed217e84c918efe \
            p480-package/archives/phase446wx-boot-template-12272271056.zip | sha256sum -c -
          unzip -p p480-package/archives/phase446wx-artifact-12271681215.zip \
            boot-final.dtb > p480-package/unpack/boot-final.dtb
          unzip -p p480-package/archives/phase446wx-boot-template-12272271056.zip \
            boot-f0bisect-gki-p6-v1.img > p480-package/unpack/inherited-WX-boot.img
          test -s p480-package/unpack/boot-final.dtb
          printf '%s  %s\n' \
            ef0f35ad261a072f301c6f52521c4ff33c59595dd09f4c42df55e7642bbc7b09 \
            p480-package/unpack/inherited-WX-boot.img | sha256sum -c -
          # Verify the real archived final boot FDT: an enabled Kona A526B
          # sound-card node, routing and all 29 selected FE/BE platform phandles.
          # This is a bind-prerequisite check, NOT proof of runtime audio.
          # A3c cannot be claimed bind-ready when the original archived WX
          # DTB lacks the A526B model and audio-routing. Allow ONLY that
          # exactly-known mismatch to produce a diagnostic report, never a
          # candidate image. Any other preflight failure remains a hard CI FAIL.
          if ! python3 ci/p480_boot_dtb_audit.py \
            --dtb p480-package/unpack/boot-final.dtb \
            --manifest ci/P480-a3c-native-source.json \
            --report p480-package/output/P480-embedded-WX-DTB-audio-contract.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('p480-package/output')
          report = json.loads((root / 'P480-embedded-WX-DTB-audio-contract.json').read_text())
          assert report['status'] == 'DT_SOUND_BINDING_PREREQUISITES_FAILED'
          assert report['selected_dai_link_count'] == 29
          assert report['fdt_tree_count'] == 1
          assert report['flash_authorized'] is False
          assert report['hardware_validated'] is False
          assert len(report['card_candidates']) == 1
          checks = report['card_candidates'][0]['checks']
          assert checks == {
              'compatible_real_kona': True,
              'enabled_sound_card_node': True,
              'exact_A526B_card_model': False,
              'audio_routing_nonempty_even_pairs': False,
              'platform_name_phandle_lists_aligned': True,
              'selected_29_FE_BE_platforms_all_resolve': True,
          }, 'Unexpected DTB regression. Fail closed.'
          assert report['card_candidates'][0]['audio_routing_string_count'] == 0
          (root / 'P480-A3c-DTB-BLOCKED-NO-IMAGE.txt').write_text(
              'P480 A3c kernel compiled, but archived Phase446WX boot DTB is\n'
              'missing the exact A526B model and audio-routing properties.\n'
              'Audio bind prerequisites FAILED. No boot image was produced.\n'
              'DO NOT FLASH. No hardware or audio validation is claimed.\n'
              'The complete DTB audit report accompanies this file.\n')
          PY
            (cd p480-package/output && sha256sum \
              P480-embedded-WX-DTB-audio-contract.json \
              P480-A3c-DTB-BLOCKED-NO-IMAGE.txt > SHA256SUMS && \
              sha256sum -c SHA256SUMS)
            echo 'blocked=true' >> "$GITHUB_OUTPUT"
            echo '::warning::Known Phase446WX DTB A3c mismatch: model/audio-routing absent. Packaging BLOCKED, no image generated.'
            echo 'P480 native kernel build PASS; DTB audio prerequisites FAIL. Packaging BLOCKED, NO IMAGE and NO FLASH.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Identical Image bytes to the already-linked native direct-source build.
          gzip -n -c out/arch/arm64/boot/Image > p480-package/unpack/Image.gz
          NATIVE_SHA="$(sha256sum out/arch/arm64/boot/Image | cut -d' ' -f1)"
          DTB_SHA="$(sha256sum p480-package/unpack/boot-final.dtb | cut -d' ' -f1)"
          # Repack only the gzip kernel into the original 96MiB v2 boot template.
          # Abort on source/DTB drift, missing cmdline tokens, or any other
          # device-tree, ramdisk, kernel or partition metadata mismatch.
          python3 ci/p480_boot_repack.py \
            --source p480-package/unpack/inherited-WX-boot.img \
            --kernel p480-package/unpack/Image.gz \
            --output p480-package/unpack/P480-NORMAL-INTERNAL-NO-FLASH.img \
            --report p480-package/output/P480-normal-repack-contract.json \
            --expected-template-sha256 ef0f35ad261a072f301c6f52521c4ff33c59595dd09f4c42df55e7642bbc7b09 \
            --expected-dtb-sha256 "$DTB_SHA" \
            --expected-native-image-sha256 "$NATIVE_SHA"
          # HLT variant removes exactly one existing nohlt word; all other
          # bytes, including the new kernel, SHA1 boot ID, DTB and ramdisk,
          # must remain bit-identical to the audited P480 normal candidate.
          python3 ci/p480_hlt_peer.py \
            --normal p480-package/unpack/P480-NORMAL-INTERNAL-NO-FLASH.img \
            --hlt p480-package/output/P480-A3c-HLT-UNVERIFIED-DO-NOT-FLASH.img \
            --image out/arch/arm64/boot/Image \
            --report p480-package/output/P480-HLT-commandline-contract.json \
            --expected-dtb-sha256 "$DTB_SHA" --commit "$GITHUB_SHA"
          # Assert this report is explicitly unverified and nonflashable.
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('p480-package/output')
          normal = json.loads((p/'P480-normal-repack-contract.json').read_text())
          hlt = json.loads((p/'P480-HLT-commandline-contract.json').read_text())
          assert normal['flash_authorized'] is False
          assert normal['hardware_validated'] is False
          assert normal['flashable_candidate'] is False
          assert hlt['flash_authorized'] is False
          assert hlt['hardware_validated'] is False
          assert hlt['flashable_candidate'] is False
          assert all(hlt['invariants'].values())
          assert all(normal['invariants'].values())
          dtb = json.loads((p/'P480-embedded-WX-DTB-audio-contract.json').read_text())
          assert dtb['status'] == 'DT_SOUND_BINDING_PREREQUISITES_PRESENT'
          assert dtb['hardware_validated'] is False
          assert dtb['flash_authorized'] is False
          assert dtb['selected_dai_link_count'] == 29
          assert dtb['dtb_sha256'] == normal['dtb_sha256']
          assert hlt['hlt_nohlt'] == 0 and hlt['normal_nohlt'] == 1
          assert (p/'P480-A3c-HLT-UNVERIFIED-DO-NOT-FLASH.img').stat().st_size == 100663296
          manifest = json.loads(Path('ci/build-manifest.json').read_text())
          assert manifest['stage'] == 'P480-A3c-native-candidate'
          assert manifest['flash_authorized'] is False
          assert manifest['strict'] is True
          (p/'README-DO-NOT-FLASH.txt').write_text(
              'P480 A3c: CI-generated diagnostic boot image, NOT hardware tested.\n'
              'DO NOT FLASH. Header-v2 source is the pinned Phase446WX backup.\n'
              'Native Image and the HLT-only cmdline edit were verified in CI.\n'
              'This output is not an authorization to flash or a hardware PASS.\n')
          PY
          (cd p480-package/output && sha256sum \
            P480-A3c-HLT-UNVERIFIED-DO-NOT-FLASH.img \
            P480-normal-repack-contract.json P480-HLT-commandline-contract.json \
            P480-embedded-WX-DTB-audio-contract.json \
            README-DO-NOT-FLASH.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'P480 A3c boot-v2 diagnostic repack verified: HLT, pinned WX DTB, original ramdisk, NO FLASH.' >> "$GITHUB_STEP_SUMMARY"
          sha256sum p480-package/output/P480-A3c-HLT-UNVERIFIED-DO-NOT-FLASH.img >> "$GITHUB_STEP_SUMMARY"
      - name: Upload NO-FLASH diagnostic package for offline review
        if: github.ref == 'refs/heads/feature/p480-a3c-native' && steps.package.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: P480-A3c-HLT-UNVERIFIED-DO-NOT-FLASH-${{ github.sha }}
          path: p480-package/output/
          if-no-files-found: error
          retention-days: 90
      - name: Upload DTB-blocked diagnostic report (NO IMAGE, NO FLASH)
        if: github.ref == 'refs/heads/feature/p480-a3c-native' && steps.package.outputs.blocked == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: P480-A3c-DTB-BLOCKED-NO-IMAGE-${{ github.sha }}
          path: |
            p480-package/output/P480-embedded-WX-DTB-audio-contract.json
            p480-package/output/P480-A3c-DTB-BLOCKED-NO-IMAGE.txt
            p480-package/output/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
