name: P480 pin CI-verified HLT diagnostic package in permanent release (NO FLASH)

on:
  push:
    branches:
      - feature/p480-a3c-native
    paths:
      - .github/workflows/p480-archive-diagnostic.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-one-verified-p480-diagnostic:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[P480-DIAGNOSTIC-ARCHIVE]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: GiulianoB-1/A526B-Mangrove-Source
      SOURCE_SHA: 21d66693cfe0c336567f862d28be5a0751751611
      SOURCE_RUN: '44736425786'
      SOURCE_ARTIFACT: P480-A3c-HLT-UNVERIFIED-DO-NOT-FLASH-21d66693cfe0c336567f862d28be5a0751751611
      RELEASE_TAG: p480-a3c-hlt-ci-diagnostic-21d66693
      WX_BOOT_SHA: ef0f35ad261a072f301c6f52521c4ff33c59595dd09f4c42df55e7642bbc7b09
    steps:
      - name: Checkout the verified packaging auditor (never modify source)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require exactly matching successful build and safety audit
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.conclusion')" = success
          # This was the source-branch push build; its package stage ran.
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_branch')" = feature/p480-a3c-native
          test "$(gh api "repos/$REPO/actions/runs/44736425792" --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPO/actions/runs/44736425792" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/44736435973" --jq '.conclusion')" = success
          # A preexisting release is not overwritten or silently replaced.
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release tag $RELEASE_TAG already exists. Refusing asset overwrite."
            exit 1
          fi
      - name: Download exact successful Actions artifact and verify every payload
        run: |
          set -Eeuo pipefail
          mkdir -p p480-release
          gh run download "$SOURCE_RUN" --repo "$REPO" \
            --name "$SOURCE_ARTIFACT" --dir p480-release
          test -f p480-release/P480-A3c-HLT-UNVERIFIED-DO-NOT-FLASH.img
          test -f p480-release/P480-HLT-commandline-contract.json
          test -f p480-release/P480-normal-repack-contract.json
          test -f p480-release/README-DO-NOT-FLASH.txt
          test -f p480-release/SHA256SUMS
          (cd p480-release && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json, runpy
          root = Path('p480-release')
          normal = json.loads((root / 'P480-normal-repack-contract.json').read_text())
          hlt = json.loads((root / 'P480-HLT-commandline-contract.json').read_text())
          image_path = root / 'P480-A3c-HLT-UNVERIFIED-DO-NOT-FLASH.img'
          blob = image_path.read_bytes()
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          parse_boot = runpy.run_path('ci/p480_boot_repack.py')['parse_boot']
          parsed = parse_boot(blob)
          assert len(blob) == 100663296
          assert parsed['header_version'] == 2
          assert normal['status'] == 'UNVERIFIED_BOOT_DIAGNOSTIC_DO_NOT_FLASH'
          assert normal['source_sha256'] == 'ef0f35ad261a072f301c6f52521c4ff33c59595dd09f4c42df55e7642bbc7b09'
          assert hlt['source_commit'] == '21d66693cfe0c336567f862d28be5a0751751611'
          assert all(normal['invariants'].values()) and all(hlt['invariants'].values())
          assert normal['flash_authorized'] is False and hlt['flash_authorized'] is False
          assert normal['hardware_validated'] is False and hlt['hardware_validated'] is False
          assert normal['flashable_candidate'] is False and hlt['flashable_candidate'] is False
          assert hlt['hlt_nohlt'] == 0 and hlt['normal_nohlt'] == 1
          assert parsed['cmdline'] == hlt['hlt_cmdline']
          assert normal['cmdline'] == hlt['normal_cmdline']
          assert hlt['normal_cmdline'].split().count('nohlt') == 1
          assert parsed['cmdline'].split().count('nohlt') == 0
          assert sha(blob) == hlt['hlt_boot_sha256']
          assert sha(parsed['kernel']) == hlt['kernel_sha256']
          assert sha(gzip.decompress(parsed['kernel'])) == hlt['native_image_sha256']
          assert sha(parsed['dtb']) == normal['dtb_sha256'] == hlt['dtb_sha256']
          assert sha(parsed['ramdisk']) == normal['ramdisk_sha256'] == hlt['ramdisk_sha256']
          assert parsed['id'][:20].hex() == normal['new_boot_id']
          print('P480 PERMANENT ARCHIVE GATE PASS: byte-exact HLT source and non-flash intent.')
          PY
      - name: Publish permanent GitHub pre-release, no approval to flash
        run: |
          set -Eeuo pipefail
          cat > p480-release/README-PERMANENT-ARCHIVE.txt <<EOF
          P480 A3c diagnostic boot, UNVERIFIED, DO NOT FLASH.
          Source repository: $REPO
          Source commit: $SOURCE_SHA
          Verified GitHub Actions build: $SOURCE_RUN
          Legacy Phase446WX original boot SHA256: $WX_BOOT_SHA
          All HLT, DTB, ramdisk, boot ID and build-link invariants passed in CI.
          Hardware boot/audio not tested. No merge or flashing is authorized.
          This release preserves the CI payload after Actions artifact expiry.
          EOF
          cat > p480-release/RELEASE-NOTES.md <<EOF
          ## P480 A3c HLT source-built diagnostic, NOT flash authorized
          Original P480 kernel Image and vmlinux compiled from commit \`$SOURCE_SHA\`.
          Pinned 96 MiB Phase446WX boot header-v2 template; original ramdisk and
          STM DTB retained. HLT removes only \`nohlt\`. A3c, H4 and all P479
          safety source audits passed. All bundled SHA256SUMS are verified.

          **No hardware validation has been performed. Do not flash.**
          This is a long-term recovery/archive copy of the exact CI artifact.
          EOF
          (cd p480-release && sha256sum \
            P480-A3c-HLT-UNVERIFIED-DO-NOT-FLASH.img \
            P480-HLT-commandline-contract.json \
            P480-normal-repack-contract.json \
            README-DO-NOT-FLASH.txt \
            README-PERMANENT-ARCHIVE.txt RELEASE-NOTES.md \
            > SHA256SUMS-RELEASE && sha256sum -c SHA256SUMS-RELEASE)
          gh release create "$RELEASE_TAG" --repo "$REPO" \
            --target "$SOURCE_SHA" --prerelease \
            --title "P480 A3c HLT CI diagnostic (UNVERIFIED, NO FLASH)" \
            --notes-file p480-release/RELEASE-NOTES.md \
            p480-release/P480-A3c-HLT-UNVERIFIED-DO-NOT-FLASH.img \
            p480-release/P480-HLT-commandline-contract.json \
            p480-release/P480-normal-repack-contract.json \
            p480-release/README-DO-NOT-FLASH.txt \
            p480-release/README-PERMANENT-ARCHIVE.txt \
            p480-release/SHA256SUMS \
            p480-release/SHA256SUMS-RELEASE
          echo 'P480 A3c diagnostic archived as permanent NO-FLASH GitHub pre-release, source commit pinned.' >> "$GITHUB_STEP_SUMMARY"
          gh release view "$RELEASE_TAG" --repo "$REPO" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
