name: Mangrove read-only safety audits against real source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangrove-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-safety:
    name: P479 legacy contracts on committed kernel tree (read-only)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GiulianoB-1/A526B-Mangrove-Kernel
          ref: e2e9f3fad600489deb8fa0816245a87cef6b9b95
          path: audit-tools
          persist-credentials: false
      - name: Run original stage check-only contracts on actual source
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$GITHUB_WORKSPACE/source"
          cd audit-tools
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,base64,zlib
          p=Path('scripts/446t_apply_smmu_hold_no_nested.py.z64')
          raw=zlib.decompress(base64.b64decode(p.read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='c589faa4a829d56a394a839349b8d23f250c467522aa3781927504c2873edc37'
          Path('scripts/446t_apply_smmu_hold_no_nested.py').write_bytes(raw)
          p=Path('scripts/446y_apply_handoff_i2c.py.z64')
          raw=zlib.decompress(base64.b64decode(p.read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='0cd9a1eea938e8f3aa74e48d9b11b89cdfacfce3defb476e069d292774beb81d'
          old=b'    if (!gi2c->se.wrapper)\n        return -EPROBE_DEFER;'
          new=b'    if (!gi2c->se.wrapper) {\n        return -EPROBE_DEFER;\n    }'
          assert raw.count(old)==1
          raw=raw.replace(old,new,1)
          assert hashlib.sha256(raw).hexdigest()=='d9b95c7f7ee9ccc14e590d82a5d6b91f737c504babc63132d0488fc0447016b7'
          Path('scripts/446y_apply_handoff_i2c.py').write_bytes(raw)
          PY
          python3 scripts/446t_apply_smmu_hold_no_nested.py --root "$ROOT" --check-only
          while IFS= read -r stage; do
            test -n "$stage" || continue
            python3 "scripts/$stage.py" --root "$ROOT" --check-only
          done <<'AUDITS'
          446r2_bound_rpmh_tcs
          446r2_apply_pon_wake_diag
          446s_apply_memlat_guards
          446s_apply_arm_memlat_pmu
          446s_port_legacy_pmic_gpio
          446s_apply_suspend_timing
          446s_apply_frame_trace
          446s_apply_gpu_slumber_trace
          446s_apply_kgsl_smmu_runtime_pm
          446t_early_frame_trace
          446u_apply_atomic_request_trace
          446u_expand_p445_store
          446u_apply_usb_console_handover
          446v_apply_hwc_read_trace
          446v_apply_state_diff
          446v_apply_pmk8350_rtc
          446w_apply_splash_select
          446w_apply_handoff_option_b
          446w_apply_ttygs3
          446w_b_apply_first_hwc_modeset
          446w_b_apply_dsi_path_trace
          446x_apply_stm_touch
          446y_apply_handoff_i2c
          446y_fix_geni_clock_unwind
          446z_apply_qup_core_touch
          446aa_trace_touch_drm
          446ab_probe_fifo_and_property_epochs
          446ac_stage_gpi
          446ac_gsi_i2c
          446ac_hwc_ring
          446ad_fix_ipc_logging_compat
          446ad_gsi_crash_guard
          446ae_dma_wrapper_guard
          446af_gpi_callback_abi
          447b_restore_446ag_touch
          447_stage_control
          447c_quiet_frame_trace
          447_flicker_ring
          475_s2_cable_ro
          476_h2_manual_1000
          477_h3_dcp_stepped
          477_mgbatt_shadow_stage
          479_h4_auto
          479_mgbatt_shadow3
          472_a3b_lpass_codec_d54
          447d_se7_se10_i2c
          447d_readonly_sm5714_fg
          447e_samsung_battery_platform
          447e_alias_audit
          447f_tg_i2c_nr
          447f_sm5714_fg_child
          447f_soc_scaling
          447g_chg_guard
          447g_ntc_iio
          447g_adc5_gpio2
          447h_adc5_tg_ntc
          447h_ntc_retry
          447h_tchg_ntc
          447h_soc_policy
          449f_chg_ntc_guard
          450_daily_fg_and_guard_diag
          451_daily_readonly
          453_daily_usb_resume
          447j_vblank_diag
          447k_vblank_hooks
          447i_touch_lifecycle_trace
          447l_usb_stage_diag
          447n_late_touch_usb_function
          473_b1_probe_guard
          473_b2_se1_pinctrl
          473_b3_se1_baud
          472_a1_tg_native
          AUDITS
          grep -Fxq 'CONFIG_P479_H4=y' "$ROOT/ci/build.config"
          grep -Fxq 'CONFIG_SECURITY_SELINUX=y' "$ROOT/ci/build.config"
          echo 'P479 read-only source contract gates PASS; charging hardware policy remains off by default; NO FLASH.' >> "$GITHUB_STEP_SUMMARY"

      - name: P480 native A3c ABI and no-flash source-only contract
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -f source/ci/p480_a3c_source_audit.py; then
            python3 source/ci/p480_a3c_source_audit.py --root source
            echo 'P480 native A3c guards and no-flash source contracts PASS; hardware untested.' >> "$GITHUB_STEP_SUMMARY"
          elif grep -Fxq 'CONFIG_P480_A3C=y' source/ci/build.config; then
            echo '::error::P480 enabled but independent A3c audit is missing'
            exit 1
          else
            echo 'P480 absent in pinned P479 baseline, A3c source check not required.'
          fi

      - name: Fetch exact pinned public TG A52XQ board-r02 DTS
        if: ${{ hashFiles('source/ci/p480_tg_r02_overlay_source_audit.py') != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p p480-tg-r02
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --max-time 90 \
            'https://raw.githubusercontent.com/micr0softstore/samsung_android_kernel_a52xq/6bf351bdf18bdb228db79e66f14a7a9c0178e5d7/arch/arm64/boot/dts/samsung/a52/a52xq/a52xq_eur_open_w00_r02.dts' \
            --output p480-tg-r02/TG-A52XQ-r02-pinned.dts
          test -s p480-tg-r02/TG-A52XQ-r02-pinned.dts
          test "$(git hash-object --no-filters p480-tg-r02/TG-A52XQ-r02-pinned.dts)" = \
            72de76f7bae4b29ccc8663013936c0667a954180
      - name: Audit original Samsung DTBO source without changing boot DTB
        if: ${{ hashFiles('source/ci/p480_tg_r02_overlay_source_audit.py') != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 source/ci/p480_tg_r02_overlay_source_audit.py \
            --reference-dts p480-tg-r02/TG-A52XQ-r02-pinned.dts \
            --report p480-tg-r02/P480-TG-r02-audio-overlay-source-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('p480-tg-r02')
          report = json.loads((root/'P480-TG-r02-audio-overlay-source-report.json').read_text())
          assert report['status'] == 'TG_R02_AUDIO_OVERLAY_SOURCE_PRESENT_UNMERGED'
          assert report['card_model_from_fragment_2'] == 'lito-lagoonmtp-snd-card'
          assert report['final_audio_routing_string_count'] == 54
          assert report['final_routing_from_fragment'] == 126
          assert report['boot_template_dtb_modified'] is False
          for flag in ('actual_device_dtbo_verified', 'bootloader_applied_dtbo_verified',
                       'merged_live_fdt_verified', 'a3c_binding_verified',
                       'hardware_validated', 'flash_authorized', 'flashable_candidate'):
              assert report[flag] is False, flag
          assert not any(root.glob('*.img'))
          print('PINNED TG SOURCE CHECK PASS; runtime DTBO state UNKNOWN; NO FLASH')
          PY
          (cd p480-tg-r02 &&
            sha256sum P480-TG-r02-audio-overlay-source-report.json > SHA256SUMS &&
            sha256sum -c SHA256SUMS)
          echo 'Pinned TG r02 A52XQ source contains model and final audio routing in DTBO fragments. Source-only evidence, runtime merge UNVERIFIED. NO FLASH.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save source-only diagnostic report (no boot image)
        if: ${{ hashFiles('p480-tg-r02/P480-TG-r02-audio-overlay-source-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: P480-TG-r02-OVERLAY-SOURCE-ONLY-${{ github.sha }}
          path: |
            p480-tg-r02/P480-TG-r02-audio-overlay-source-report.json
            p480-tg-r02/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: P480 exact 27-pair live r02 route cross-check
        if: ${{ hashFiles('p480-tg-r02/P480-TG-r02-audio-overlay-source-report.json') != '' }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          live=json.loads(Path('source/ci/P480-live-r02-merged-sound-evidence.json').read_text())
          tg=json.loads(Path('p480-tg-r02/P480-TG-r02-audio-overlay-source-report.json').read_text())
          assert len(live['routing_pairs'])==27
          assert live['routing_pairs']==tg['final_audio_routing_pairs']
          assert live['asoc_platform_names']==tg['final_platform_names']
          assert live['model']==tg['card_model_from_fragment_2']=='lito-lagoonmtp-snd-card'
          assert live['flash_authorized'] is False
          print('P480 TG r02 live source route comparison 27/27 PASS, NO FLASH')
          PY
